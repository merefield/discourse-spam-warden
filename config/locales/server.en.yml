en:
  site_settings:
    spam_warden_email_report_points: "Points per cumulative email report before its cap and recency adjustment. Display scoring only; does not change moderation thresholds."
    spam_warden_email_points_cap: "Maximum email points before recency adjustment. Reports last seen within 7 days receive full weight, within 30 days half, and older or undated matches zero."
    spam_warden_ip_report_points: "Points per cumulative registration IP report before its cap and recency adjustment. Display scoring only; does not change moderation thresholds."
    spam_warden_ip_points_cap: "Maximum registration IP points before recency adjustment. Reports last seen within 7 days receive full weight, within 30 days half, and older or undated matches zero."
    spam_warden_ai_integration: "Show existing Discourse AI spam findings to admins and consolidate pending Spam Warden reviews with AI post reviews. Requires Discourse AI to be installed. Does not run an LLM, add AI risk points, or automatically submit reports. Disable to turn off this integration."
    spam_warden_submissions_enabled: "Allow admins to preview and explicitly submit locally confirmed spam to Stop Forum Spam. Requires a submission API key. Reporting sends the account username, email, public registration IP and the previewed evidence, independently of lookup identifier settings. Risk scores never trigger submission."
    spam_warden_submission_api_key: "Your site's Stop Forum Spam submission API key. Required only for reporting, not reputation lookups. Keep this key private."
    spam_warden_email_moderate_confidence: "Minimum email reputation score for human review, together with {{setting:spam_warden_email_moderate_frequency}} and {{setting:spam_warden_max_evidence_age_days}}. This is not a probability of spam."
    spam_warden_email_moderate_frequency: "Minimum email report count for human review, together with {{setting:spam_warden_email_moderate_confidence}} and the evidence age limit."
    spam_warden_reading_limited_adjustment: "Risk points applied for limited reading activity. Negative values reduce concern; 0 disables this adjustment. Only one reading adjustment applies per check."
    spam_warden_reading_meaningful_adjustment: "Risk points applied after at least 1 topic viewed, 3 posts read and 60 seconds of reading. Negative values reduce concern; 0 disables this adjustment."
    spam_warden_reading_sustained_adjustment: "Risk points applied after at least 5 topics viewed, 30 posts read, 10 minutes of reading and 2 days visited. Negative values reduce concern; 0 disables this adjustment."
    spam_warden_no_reading_adjustment: "Risk points added for no reading after posting, or on a follow-up check at least an hour after registration. Fresh accounts without posts remain neutral."
    spam_warden_confirmed_spam_points: "Risk points per distinct post with a staff-confirmed spam flag in the last 30 days. Multiply by the post count and add after reading adjusts suspicion. Reading never reduces confirmed spam points; the final score is capped at 100. Confirmed spam still requires review regardless of the configured points; it never authorizes automatic silencing."
    spam_warden_local_points_cap: "Maximum combined posting and extension points before reading. Confirmed spam is added separately and cannot be reduced by reading. The final score is capped at 100."
    spam_warden_enabled: "Check new accounts against Stop Forum Spam. Sends enabled identifiers to the selected external service. Start in Observe mode to evaluate results."
    spam_warden_mode: "Observe records evidence only. Review queues accounts that meet the reputation or local-signal review rules. Protect also silences new accounts with strong email evidence under the selected preset. Manual checks and local signals never authorize an automatic silence."
    spam_warden_preset: "Conservative requires strong, recent email and IP evidence for automatic silencing. Balanced requires strong, recent email evidence. IP or username alone never automatically silences."
    spam_warden_check_email: "Check account email addresses against Stop Forum Spam."
    spam_warden_check_ip: "Check public registration IP addresses. Shared addresses alone never automatically silence an account."
    spam_warden_check_username: "Check usernames as informational evidence. Username matches alone never cause review or silencing."
    spam_warden_local_signals: "Include exact duplicate posts, posting bursts across public topics, and staff-confirmed spam flags in account assessments. Eligible new accounts are rechecked after posting or a flag review. Local signals can request review but never authorize a silence. Start with {{setting:spam_warden_mode}} set to Observe."
    spam_warden_region: "Send lookups to the closest Stop Forum Spam endpoint or its European endpoint."
    spam_warden_recheck_hours: "Recheck new accounts once after this many hours; 0 disables the delayed check. Established, staff, and explicitly allowed accounts are skipped."
    spam_warden_retention_days: "Keep check history for this many days. Evidence for pending reviews and account exceptions is retained until resolved or removed."
    spam_warden_email_confidence: "Minimum email reputation score for strong evidence. This is not a probability that the account is a spammer."
    spam_warden_email_frequency: "Minimum number of email reports for strong evidence."
    spam_warden_ip_confidence: "Minimum IP reputation score for strong evidence."
    spam_warden_ip_frequency: "Minimum number of IP reports for strong evidence."
    spam_warden_max_evidence_age_days: "Maximum age of external evidence that can cause review or silencing. Display scoring uses its separate 7-day full-weight and 30-day half-weight windows."
  spam_warden:
    submission_failed: "The report could not be approved. Refresh the preview, check reporting settings, and explicitly confirm the evidence."
    allow: "Allow this account"
    confirm: "Silence account"
    confirm_message: "Silence this account after reviewing the evidence?"
    confirm_restriction: "Confirm existing restriction"
    silence_reason: "Strong Stop Forum Spam reputation evidence. Review case #%{reviewable_id}."
    manual_silence_reason: "Staff confirmed a Spam Warden review. Review case #%{reviewable_id}."
    silence_failed: "The account restriction changed. Refresh the review before taking another action."
    check_failed: "This account could not be checked. Enable Spam Warden and check that the account is eligible."
  reviewables:
    reasons:
      spam_warden: "Reputation or local account evidence met this site's Spam Warden review policy."
