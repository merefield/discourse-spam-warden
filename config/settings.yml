plugins:
  spam_warden_enabled:
    default: false
  spam_warden_mode:
    default: observe
    type: enum
    choices:
      - observe
      - review
      - protect
  spam_warden_preset:
    default: conservative
    type: enum
    choices:
      - conservative
      - balanced
  spam_warden_check_email:
    default: true
  spam_warden_check_ip:
    default: true
  spam_warden_check_username:
    default: false
  spam_warden_local_signals:
    default: true
  spam_warden_reading_limited_adjustment:
    default: -5
    min: -100
    max: 0
  spam_warden_reading_meaningful_adjustment:
    default: -10
    min: -100
    max: 0
  spam_warden_reading_sustained_adjustment:
    default: -15
    min: -100
    max: 0
  spam_warden_no_reading_adjustment:
    default: 10
    min: 0
    max: 100
  spam_warden_confirmed_spam_points:
    default: 85
    min: 0
    max: 100
  spam_warden_local_points_cap:
    default: 100
    min: 0
    max: 100
  spam_warden_region:
    default: closest
    type: enum
    choices:
      - closest
      - europe
  spam_warden_recheck_hours:
    default: 24
    min: 0
    max: 168
  spam_warden_retention_days:
    default: 30
    min: 7
    max: 365
  spam_warden_email_confidence:
    default: 90
    min: 50
    max: 100
  spam_warden_email_frequency:
    default: 5
    min: 2
    max: 10000
  spam_warden_ip_confidence:
    default: 95
    min: 50
    max: 100
  spam_warden_ip_frequency:
    default: 10
    min: 2
    max: 10000
  spam_warden_max_evidence_age_days:
    default: 30
    min: 1
    max: 90
  spam_warden_email_moderate_confidence:
    default: 50
    min: 0
    max: 100
  spam_warden_email_moderate_frequency:
    default: 3
    min: 1
    max: 10000
  spam_warden_submissions_enabled:
    default: false
  spam_warden_submission_api_key:
    default: ""
    secret: true
  spam_warden_ai_integration:
    default: true
  spam_warden_email_report_points:
    default: 8
    min: 0
    max: 100
  spam_warden_email_points_cap:
    default: 60
    min: 0
    max: 100
  spam_warden_ip_report_points:
    default: 3
    min: 0
    max: 100
  spam_warden_ip_points_cap:
    default: 30
    min: 0
    max: 100
